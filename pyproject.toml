[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "dotfiles-dev"
version = "0.1.0"
description = "Host workspace launcher for personal development"
requires-python = ">=3.11"
dependencies = ["click==8.3.3"]

[project.scripts]
dev = "dotfiles_dev.cli:main"

[project.optional-dependencies]
dev = ["pytest==8.4.2", "pexpect==4.9.0"]

[tool.hatch.build.targets.wheel]
packages = ["dotfiles_dev"]

[tool.hatch.envs.default]
features = ["dev"]

[tool.hatch.envs.default.scripts]
test = "python -m pytest {args}"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"

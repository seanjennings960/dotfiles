[build-system]
requires = ["uv_build>=0.13.1,<0.14"]
build-backend = "uv_build"

[project]
name = "devchain"
version = "0.1.0"
description = "Host workspace launcher for personal development"
requires-python = ">=3.11"
dependencies = ["click==8.3.3"]

[project.scripts]
dev = "dotfiles_dev.cli:main"

[project.optional-dependencies]
dev = ["pytest==8.4.2", "pexpect==4.9.0"]

[tool.uv.build-backend]
module-name = "dotfiles_dev"
module-root = ""

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
